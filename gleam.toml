# Lets Gleam projects depend on this fork from git: gleam compiles the Erlang
# modules in src/ and fetches quic and h2 from Hex. rebar.config stays the
# build for rebar3; keep the two dependency lists in step.
name = "webtransport"
version = "0.5.11"
description = "WebTransport protocol for Erlang (HTTP/2 and HTTP/3)"
licences = ["Apache-2.0"]
target = "erlang"

[repository]
type = "github"
user = "spotdemo4"
repo = "erlang-webtransport"

[dependencies]
quic = ">= 3.1.0 and < 3.2.0"
h2 = ">= 0.18.0 and < 0.19.0"

[erlang]
extra_applications = ["public_key"]
